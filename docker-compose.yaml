version: "3.9"

services:
  client:
    name: vite
    image: node:22-alpine
    container_name: vite-web
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    env_file:
      - .env
    volumes:
      - ./apps/web:/app
    depends_on:
      - backend
    networks:
      - app-network

  server:
    name: express
    image: node:22-alpine
    container_name: express-api
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./apps/api:/app
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/forge
    depends_on:
      - postgres
    networks:
      - app-network

  database:
    name: postgres
    image: postgres:17-alpine
    container_name: postgres-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge